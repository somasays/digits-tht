# One target. Everything runs locally, so there is nothing to select between.
#
# dbt-spark's session method builds a SparkSession inside dbt's own process
# (adapters/spark/session.py), applying these to the builder before getOrCreate(), and
# PySpark turns builder configuration into spark-submit arguments -- which is where
# spark.jars.packages has to be resolved. So Delta, UTC and the warehouse are declared
# here rather than wired in code. pipeline.spark.local_session mirrors them exactly,
# because the two processes share one metastore and must agree about it.
#
# No host, catalog or credential of any kind: nothing here reaches a warehouse.
pipeline:
  target: local
  outputs:
    local:
      type: spark
      method: session
      # Required by the credentials schema; unused by the session method.
      host: local
      # A schema, not an environment. The gate-failure test overrides it so a run that
      # trips the gate cannot block later builds in the schema the demonstration uses.
      schema: "{{ env_var('DBT_SCHEMA', 'pipeline') }}"
      # Embedded Derby is a single-writer metastore; concurrency here only deadlocks DDL.
      threads: 1
      server_side_parameters:
        spark.sql.session.timeZone: UTC
        spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
        spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
        spark.jars.packages: io.delta:delta-spark_2.12:3.2.1
        # Local mode puts the executor in the driver, so this is the whole heap. The
        # default dies reading the full replay's raw table; see pipeline.spark.
        spark.driver.memory: 4g
        # Relative: no machine-specific path is committed, and every command runs from
        # the repository root.
        spark.sql.warehouse.dir: var/warehouse
